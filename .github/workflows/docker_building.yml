name: Build development images
run-name: Build development images

on:
  push:
    branches:
      - main
    paths:
      - 'common/Dockerfile'
      - 'hydrolib/Dockerfile'
      - 'hydrodrivers/Dockerfile'
      - '.github/workflows/docker_building.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}

jobs:
  common:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
      image: ${{ steps.build.outputs.digest && format('seajackal/hydrolib-common@{0}', steps.build.outputs.digest) || 'seajackal/hydrolib-common:latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check common files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: |
            image:
              - 'common/Dockerfile'
              - '.github/workflows/docker_building.yml'
      - name: Decide whether to build
        id: decision
        uses: actions/github-script@v9
        with:
          script: |
            return context.eventName === 'workflow_dispatch'
              || ${{ steps.filter.outputs.image == 'true' }};
      - name: Set up Docker Buildx
        if: steps.decision.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: steps.decision.outputs.result == 'true'
        uses: docker/login-action@v3
        with:
          username: seajackal
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and publish common image
        id: build
        if: steps.decision.outputs.result == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./common
          file: common/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            seajackal/hydrocommon_ars:latest
            seajackal/hydrocommon_ars:sha-${{ github.sha }}
          cache-from: type=gha,scope=common
          cache-to: type=gha,mode=max,scope=common

  hydrolib:
    needs: common
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Hydrolib files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: |
            image:
              - 'hydrolib/Dockerfile'
      - name: Decide whether to build
        id: decision
        uses: actions/github-script@v9
        with:
          script: |
            return context.eventName === 'workflow_dispatch'
              || ${{ needs.common.outputs.built == 'true' }}
              || ${{ steps.filter.outputs.image == 'true' }};
      - name: Set up Docker Buildx
        if: steps.decision.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: steps.decision.outputs.result == 'true'
        uses: docker/login-action@v3
        with:
          username: seajackal
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and publish Hydrolib image
        if: steps.decision.outputs.result == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./hydrolib
          file: hydrolib/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            COMMON_IMAGE=${{ needs.common.outputs.image }}
          tags: |
            seajackal/hydrolib_ars:latest
            seajackal/hydrolib_ars:sha-${{ github.sha }}
          cache-from: type=gha,scope=hydrolib
          cache-to: type=gha,mode=max,scope=hydrolib

  hydrodrivers:
    needs: common
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Hydrodrivers files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: |
            image:
              - 'hydrodrivers/Dockerfile'
      - name: Decide whether to build
        id: decision
        uses: actions/github-script@v9
        with:
          script: |
            return context.eventName === 'workflow_dispatch'
              || ${{ needs.common.outputs.built == 'true' }}
              || ${{ steps.filter.outputs.image == 'true' }};
      - name: Set up Docker Buildx
        if: steps.decision.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: steps.decision.outputs.result == 'true'
        uses: docker/login-action@v3
        with:
          username: seajackal
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and publish Hydrodrivers image
        if: steps.decision.outputs.result == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./hydrodrivers
          file: hydrodrivers/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            COMMON_IMAGE=${{ needs.common.outputs.image }}
          tags: |
            seajackal/hydrodrivers_ars:latest
            seajackal/hydrodrivers_ars:sha-${{ github.sha }}
          cache-from: type=gha,scope=hydrodrivers
          cache-to: type=gha,mode=max,scope=hydrodrivers
